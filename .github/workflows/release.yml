name: Executáveis

# Gera o Lurdens empacotado para Windows e macOS.
# - Em tags v* (ex.: v1.3.0): anexa os .zip à release da tag (criada como
#   rascunho se ainda não existir).
# - Em PRs que mexem no empacotamento e pelo botão "Run workflow": só gera e
#   guarda os .zip como artefatos da execução, para teste.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            suffix: windows-x64
          - os: macos-latest
            label: macOS (Apple Silicon)
            suffix: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependências
        run: python -m pip install -r requirements.txt pyinstaller pillow

      - name: Versão
        id: version
        shell: bash
        run: echo "version=$(python -c 'import lurdens; print(lurdens.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Empacotar (PyInstaller)
        run: python -m PyInstaller packaging/lurdens.spec --noconfirm

      - name: Autoteste do executável e .zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Lurdens\Lurdens.exe `
                -ArgumentList '--selftest', "$env:RUNNER_TEMP\frozen" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "autoteste do executável falhou ($($p.ExitCode))" }
          Compress-Archive -Path dist\Lurdens -DestinationPath "Lurdens-${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip"

      - name: Autoteste do executável e .zip (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/Lurdens.app/Contents/MacOS/Lurdens --selftest "$RUNNER_TEMP/frozen"
          ditto -c -k --sequesterRsrc --keepParent dist/Lurdens.app \
            "Lurdens-${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Lurdens-${{ steps.version.outputs.version }}-${{ matrix.suffix }}
          path: Lurdens-*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Anexar à release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release da tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --verify-tag --title "Lurdens ${TAG#v}" --notes "Rascunho: escreva as notas da versão."
          gh release upload "$TAG" dist/*.zip --clobber
