name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux — testes e autoteste
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema
        # dbus-daemon + dbus-python/GLib para o Spotify simulado;
        # bibliotecas gráficas mínimas para o Qt na plataforma offscreen.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus python3-dbus python3-gi \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: PySide6
        run: python -m pip install -r requirements.txt

      - name: Testes automatizados
        env:
          # O mock do Spotify usa dbus-python, que vem do Python do sistema.
          LURDENS_MOCK_PYTHON: /usr/bin/python3
        run: python tools/ci_unittest.py

      - name: Autoteste da interface
        run: python -m lurdens --selftest "$RUNNER_TEMP/capturas"

      - name: Capturas do autoteste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-linux
          path: ${{ runner.temp }}/capturas
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows — testes e autoteste
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependências (PySide6 + PyWinRT)
        run: python -m pip install -r requirements.txt

      - name: Testes automatizados
        run: python tools/ci_unittest.py

      - name: Autoteste da interface
        run: python -m lurdens --selftest "$env:RUNNER_TEMP\capturas"

      - name: Capturas do autoteste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-windows
          path: ${{ runner.temp }}/capturas
          if-no-files-found: ignore
          retention-days: 7
